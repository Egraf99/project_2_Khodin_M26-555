[project]
name = "primitive-db"
version = "0.1.0"
description = "Project for primitive_db"
readme = "README.md"
authors = [
    { name = "Khodin Egor", email = "khodinegor@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prompt>=0.4.1",
]

[project.scripts]
project = "primitive_db.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
